on:
  workflow_call:
    secrets:
      SECURITY_API_TOKEN:
        required: false

# Fork pull requests and Dependabot runs do not receive the Tracebit secret.
env:
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x, 26.x]
        redis: ["rs-7.4.0-v1", "8.2", "8.4.0", "8.8.0", "custom-30445126297-debian"]
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - run: npm run docker:setup
        env:
          REDIS_VERSION: ${{ matrix.redis }}

      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run test:tsd
      - run: npm run test:cov || npm run test:cov || npm run test:cov
      - run: npm run test:cluster
      - name: Coveralls
        if: matrix.node == '24.x'
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: node-${{matrix.node}}
          parallel: true

  code-coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
