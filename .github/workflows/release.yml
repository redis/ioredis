name: Release

on: workflow_dispatch

concurrency:
  group: release_version
  cancel-in-progress: true

# Fork pull requests and Dependabot runs do not receive the Tracebit secret.
env:
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  test:
    uses: ./.github/workflows/test_with_cov.yml
    secrets:
      SECURITY_API_TOKEN: ${{ secrets.SECURITY_API_TOKEN }}
  release:
    environment: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      # `npm stage publish` requires npm 11.16+
      - run: npm install -g npm@^11.16.0
      - run: npm ci
      - run: npm run build
      - run: npm run docs
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "ioredis robot"
          GIT_AUTHOR_EMAIL: "ioredis-robot@zihua.li"
        run: npx semantic-release
