name: Manual

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      branch: ${{ inputs.branch }}
    secrets:
      SECURITY_API_TOKEN: ${{ secrets.SECURITY_API_TOKEN }}
